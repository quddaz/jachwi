spring.application.name=demo

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jachwisunbae?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

spring.sql.init.mode=never

logging.level.root=INFO
logging.level.com.jachwisunbae=INFO
logging.level.org.springframework.web=WARN

auth.google.client-id=${GOOGLE_CLIENT_ID:local-google-client-id}
auth.google.client-secret=${GOOGLE_CLIENT_SECRET:local-google-client-secret}
auth.jwt.secret=${JWT_SECRET:local-development-secret-key-must-be-at-least-32-bytes}
auth.jwt.issuer=jachwi-sunbae
auth.jwt.audience=jachwi-sunbae-api
auth.jwt.access-token-seconds=3600
auth.jwt.refresh-token-seconds=1209600
